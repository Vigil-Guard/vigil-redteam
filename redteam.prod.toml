[api]
# The prod-LAN host behind this profile was retired on 2026-11-17.
# 2.x.x prod tests run on the DGX: set base_url to its stack before use.
base_url = "https://your-guardrail.example.com"
verify_tls = false
timeout = 30

[runner]
concurrency = 4
rps = 4
retries = 2
threshold = 40

[datasets]
golden_dir = "datasets/golden"
coverage_dir = "datasets/coverage"
mutation_dir = "datasets/mutation"

[reporting]
results_dir = "results"
reports_dir = "reports"
